
services:
  backend1:
    build: .
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend-1
    ports:
      - "8001:8000"
    restart: unless-stopped

  backend2:
    build: .
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend-2
    ports:
      - "8002:8000"
    restart: unless-stopped

  backend3:
    build: .
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend-3
    ports:
      - "8003:8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
